name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentimentiq
          POSTGRES_USER: sentiq
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django

      - name: Run migrations
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
          DATABASE_URL: postgres://sentiq:password@localhost:5432/sentimentiq
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
          DATABASE_URL: postgres://sentiq:password@localhost:5432/sentimentiq
          REDIS_URL: redis://localhost:6379/0
        run: pytest